name: Build

# When this workflow runs:
# - On every push to main and every pull request to main (but NOT for docs-only
#   changes — see paths-ignore below, so editing a .md file never starts a run).
# - Manually, from the GitHub Actions tab ("Run workflow").
# Tests run on every code push. The app is only published + uploaded as an
# artifact when the commit message contains "[build-app]" — the same rule as
# the mac repo (TransPeek test.yml) and SeekZip (ci.yml). Only put
# "[build-app]" in a commit message when Manh says the word "build-app"
# himself; Muse never adds it on its own.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Only one run per branch at a time. A newer push cancels the older run that is
# still in progress, so CI never wastes time on an outdated commit.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore TransPeek.sln
      - name: Build
        run: dotnet build TransPeek.sln -c Release --no-restore -p:Version=0.1.3.${{ github.run_number }}
      - name: Test
        run: dotnet test tests/TransPeek.Tests/TransPeek.Tests.csproj -c Release --no-build
      # Publish the self-contained app — ONLY when the commit message
      # contains "[build-app]". Plain test runs skip this step, so most
      # pushes are fast and produce no artifact.
      - name: Publish
        if: contains(github.event.head_commit.message, '[build-app]')
        run: dotnet publish src/TransPeek/TransPeek.csproj -c Release -r win-x64 --self-contained -o publish -p:Version=0.1.3.${{ github.run_number }}
      - name: Verify publish has WinUI resources
        if: contains(github.event.head_commit.message, '[build-app]')
        shell: pwsh
        run: |
          $hasPri = (Test-Path publish/TransPeek.pri) -or (Test-Path publish/resources.pri)
          $xbfCount = @(Get-ChildItem publish/*.xbf -ErrorAction SilentlyContinue).Count
          if (-not $hasPri) { throw 'Missing app .pri in publish output (TransPeek.pri/resources.pri)' }
          if ($xbfCount -lt 12) { throw "Only $xbfCount .xbf files in publish output, expected at least 12 (one per app XAML file)" }
          Write-Host "Publish OK: .pri present, $xbfCount .xbf files"
      - name: Upload artifact
        if: contains(github.event.head_commit.message, '[build-app]')
        uses: actions/upload-artifact@v4
        with:
          name: TransPeek-Windows-v0.1
          path: publish
          retention-days: 7
      - name: Delete older artifacts (keep only the newest)
        if: contains(github.event.head_commit.message, '[build-app]')
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts | map(select(.name=="TransPeek-Windows-v0.1")) | sort_by(.created_at) | reverse | .[1:] | .[].id')
          for id in $ids; do
            echo "Deleting old artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done
