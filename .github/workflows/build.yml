name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore TransPeek.sln
      - name: Build
        run: dotnet build TransPeek.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/TransPeek.Tests/TransPeek.Tests.csproj -c Release --no-build
      - name: Publish
        run: dotnet publish src/TransPeek/TransPeek.csproj -c Release -r win-x64 --self-contained -o publish
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransPeek-Windows-v0.1
          path: publish
          retention-days: 7
      - name: Delete older artifacts (keep only the newest)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts | map(select(.name=="TransPeek-Windows-v0.1")) | sort_by(.created_at) | reverse | .[1:] | .[].id')
          for id in $ids; do
            echo "Deleting old artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done
